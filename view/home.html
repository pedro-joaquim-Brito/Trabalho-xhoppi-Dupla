<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/home.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Home</title>
</head>
<body>
    
    <header class="logo">
        <img src="../assets/img/logo-xhoppi.png" alt="Logo Xhopii">
        <h2>Xhopii</h2>
        <p><a href="index.html">Sair</a></p>
    </header>

    <nav class="menu">
        <ul>
            <li>Home</li>
            <li>Cadastro Cliente</li>
            <li>Cadastro Funcionario</li>
            <li>Cadastro Produto</li>
            <li>Ver Clientes</li>
            <li>Ver Funcionários</li>
            <li>Ver Produtos</li>
        </ul>
    </nav>

    <!-- Carrossel -->
   <div class="container-carousel">
        <div id="carouselXhopii" class="carousel slide banner-carousel" data-bs-ride="carousel">

            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselXhopii" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselXhopii" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselXhopii" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>

            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="../assets/img/card1.png" class="d-block w-100" alt="Card 1">
                </div>
                <div class="carousel-item">
                    <img src="../assets/img/card2.png" class="d-block w-100" alt="Card 2">
                </div>
                <div class="carousel-item">
                    <img src="../assets/img/card3.png" class="d-block w-100" alt="Card 3">
                </div>
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carouselXhopii" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselXhopii" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Próximo</span>
            </button>

        </div>
    </div>

    <!-- Bootstrap JS  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
